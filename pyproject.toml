[tool.poetry]
name = "wfgm-sync-server"
version = "0.1.0"
description = ""
authors = ["celeste <hi@celestialfault.dev>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
# beanie currently restricts us to <3.14
python = "^3.10,<3.14"
fastapi = {extras = ["standard"], version = "^0.124.0"}
aiohttp = "^3.12.12"
beanie = "^2.0.1"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"

[tool.black]
line-length = 100
target-version = ["py310"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
