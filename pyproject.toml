[tool.poetry]
name = "wfgm-sync-server"
version = "0.1.0"
description = ""
authors = ["celeste <hi@celestialfault.dev>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
# beanie currently restricts us to <3.14
python = "^3.10,<3.14"
fastapi = {extras = ["standard-no-fastapi-cloud-cli"], version = "^0.162.0"}
aiohttp = "^3.14.3"
beanie = "^2.2.0"
slowapi = "^0.1.10"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.fastapi]
entrypoint = "main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
